site: '_site'
force_language: 'en' # https://pagefind.app/docs/multilingual/#opting-out-of-multilingual-search
exclude_selectors:
  - 'button[popovertarget]'
  - 'article[popover]' # notes, variants, info and parallels; notes get their own bundle (searchExtras.js)
  - '.inline-comment'
  - '.reference'
  - '.root:not([data-indexed])' # root text, bar segments with the sutta title
  #  from SC:
  - '.ref' # segment references
  - '.end'
  - '.endsection'
  - '.endsubsection'
  - '.endsutta'
  - '.endbook'
  - '.endkanda'
  - '.endvagga'
  - '.expansion-instructions' # ie /sn19.1/en/sujato
  - '.pe' # ie. inline legacy vinaya notes
  - '.add' # ie. translator additions in suddhaso's translations
  - 'main[data-lang="lzh"] > *' # searchExtras.js indexes the Chinese texts by character pairs instead
