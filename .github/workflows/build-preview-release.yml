name: Build & Preview Release

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly on 1st at midnight UTC

permissions:
  contents: write
  pull-requests: write

env:
  # Public SHA-256 fingerprint of the Android signing certificate (from `keytool -list -v`).
  # Every APK is checked against it before upload, and it's published in the release notes
  # so users can verify APKs. If the signing key ever changes, update this in the same commit
  ANDROID_CERT_SHA256: '4A:4C:B7:86:C3:4C:CE:76:7D:C6:B8:D1:7B:BC:3F:F1:91:31:30:D2:59:16:E6:B8:61:AD:DF:C8:AB:9F:C0:AB'

jobs:
  check-tag:
    name: Check Tag Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if tag is on main branch
        id: check
        run: |
          if git branch -r --contains ${{ github.ref }} | grep -q 'origin/main'; then
            echo "on-main=true" >> $GITHUB_OUTPUT
            echo "✓ Tag ${{ github.ref_name }} is on main branch"
          else
            echo "on-main=false" >> $GITHUB_OUTPUT
            echo "⊘ Tag ${{ github.ref_name }} is NOT on main branch - skipping production release"
          fi

  release-draft:
    name: Create Draft Release
    runs-on: ubuntu-latest
    needs: check-tag
    if: needs.check-tag.outputs.on-main == 'true'
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      preview_url: ${{ steps.vercel_deploy.outputs.preview_url }}
      date: ${{ steps.date.outputs.date }}
      tag_message: ${{ steps.tag_message.outputs.message }}
      html_count: ${{ steps.size.outputs.html_count }}
      total_count: ${{ steps.size.outputs.total_count }}
      archive_name: ${{ steps.archive.outputs.archive_name }}
      archive_size: ${{ steps.size.outputs.size }}
      build_duration: ${{ steps.stats.outputs.build_duration }}
      eleventy_duration: ${{ steps.stats.outputs.eleventy_duration }}
      search_duration: ${{ steps.stats.outputs.search_duration }}
      eleventy_files: ${{ steps.stats.outputs.eleventy_files }}
      html_summary: ${{ steps.stats.outputs.html_summary }}
      fetch_summary: ${{ steps.stats.outputs.fetch_summary }}
      fetch_failures: ${{ steps.stats.outputs.fetch_failures }}
      assets_summary: ${{ steps.stats.outputs.assets_summary }}
      search_pages: ${{ steps.stats.outputs.search_pages }}
      search_words: ${{ steps.stats.outputs.search_words }}
      checks_passed: ${{ steps.checks.outcome == 'success' }}
      pgp_public_key: ${{ steps.site_meta.outputs.pgp_public_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch tag annotations
        run: git fetch --tags --force

      - name: Verify tag exists
        run: |
          TAG="${{ github.ref_name }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "✗ Tag $TAG not found after fetch"
            exit 1
          fi
          echo "✓ Tag $TAG verified"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Get date
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # A tag pushed again that day reuses its first fetch, as caches are kept per tag name
      - name: Restore fetch cache
        id: fetch-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ steps.day.outputs.day }}
          restore-keys: fetch-${{ github.job }}-${{ steps.day.outputs.day }}-

      - name: Build site
        id: build
        shell: bash
        run: |
          START=$(date +%s)
          pnpm predeploy 2>&1 | tee build.log
          echo "seconds=$(( $(date +%s) - START ))" >> $GITHUB_OUTPUT

      # Each attempt saves under its own key, as a cache key can't be saved twice
      - name: Save fetch cache
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Whether the fetched data built the site it should. A failure doesn't stop the release,
      # it just leaves it for review by hand instead of deploying itself
      - name: Check build
        id: checks
        continue-on-error: true
        run: pnpm test

      # Only data that passed the checks, so a retry after a failed check fetches again
      - name: Save daily fetch cache
        if: steps.fetch-cache.outputs.cache-hit != 'true' && steps.checks.outcome == 'success'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ steps.day.outputs.day }}

      - name: Collect build stats
        id: stats
        continue-on-error: true
        env:
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
        run: node tools/buildStats.js

      - name: Get current version
        id: version
        run: |
          # Use github.ref_name directly since this job only runs on tag push
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Generate datestamp
        id: date
        run: |
          DATE=$(date +%Y%m%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Datestamp: $DATE"

      - name: Get tag message
        id: tag_message
        run: |
          # Get the tag annotation message (not commit message)
          # git cat-file gets the raw tag object, then we skip headers until blank line
          TAG_MESSAGE=$(git cat-file tag ${{ steps.version.outputs.tag }} | sed '1,/^$/d')
          if [ -z "$TAG_MESSAGE" ]; then
            TAG_MESSAGE="Version ${{ steps.version.outputs.tag }}"
          fi
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Read release key
        id: site_meta
        run: node -e "import('./src/data/_siteMetaData.js').then(m => console.log('pgp_public_key=' + (m.default().pgpPublicKey ?? '')))" >> $GITHUB_OUTPUT

      - name: Create archive
        id: archive
        run: |
          ARCHIVE_NAME="scx_archive-${{ steps.version.outputs.version }}.tar.gz"
          echo "Creating archive: $ARCHIVE_NAME"
          node tools/archive.js "${{ steps.version.outputs.version }}" ".dist/$ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "archive_path=.dist/$ARCHIVE_NAME" >> $GITHUB_OUTPUT

      - name: Get archive size and file count
        id: size
        run: |
          SIZE=$(du -h .dist/${{ steps.archive.outputs.archive_name }} | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Archive size: $SIZE"

          HTML_COUNT=$(find _site -type f -name "*.html" | wc -l | tr -d ' ')
          TOTAL_COUNT=$(find _site -type f | wc -l | tr -d ' ')
          echo "html_count=$HTML_COUNT" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "HTML files: $HTML_COUNT"
          echo "Total files: $TOTAL_COUNT"

      - name: Deploy to Vercel Preview
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          OUTPUT=$(npx vercel deploy --archive=tgz --cwd=_site -A "$PWD/vercel.json" --token="$VERCEL_TOKEN" 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*vercel\.app[^ ]*' | head -1)
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      # One file, as Windows runners fail to download the site's 241k files from an artifact
      - name: Pack site for app builds
        run: tar -cf site.tar _site

      - name: Upload site artifact for Tauri builds
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: site.tar
          retention-days: 1

      - name: Create draft release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          body: |
            ${{ steps.tag_message.outputs.message }}

            ---

            **Preview Deployment:** ${{ steps.vercel_deploy.outputs.preview_url }}

            > ⏳ **App builds in progress.** Please wait for all builds to complete before publishing.

            **Build Info:**
            - Date: ${{ steps.date.outputs.date }}
            - Trigger: Tag push to main
            - Version: ${{ steps.version.outputs.version }}
            - Files: ${{ steps.size.outputs.html_count }} HTML files (${{ steps.size.outputs.total_count }} total)
          files: .dist/${{ steps.archive.outputs.archive_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    name: Build Tauri (${{ matrix.name }})
    needs: release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: 'macOS ARM64'
            rust_target: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: 'macOS Intel'
            rust_target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            name: 'Linux'
            rust_target: ''
          - platform: windows-latest
            args: ''
            name: 'Windows'
            rust_target: ''
          - platform: ubuntu-latest
            name: 'Android ARM64'
            rust_target: 'aarch64-linux-android'
            android: true
            android_target: 'aarch64'
            abi: 'arm64'
          - platform: ubuntu-latest
            name: 'Android ARMv7'
            rust_target: 'armv7-linux-androideabi'
            android: true
            android_target: 'armv7'
            abi: 'armv7'
    runs-on: ${{ matrix.platform }}

    steps:
      # The site, Rust target dir and Gradle together get close to the runner's free space
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      # Compiling the app crate, with the whole site embedded, can run the runner out of memory
      - name: Add swap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 16G /swapfile.ci
          sudo chmod 600 /swapfile.ci
          sudo mkswap /swapfile.ci
          sudo swapon /swapfile.ci
          free -h
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build

      - name: Unpack site
        shell: bash
        run: tar -xf site.tar && rm site.tar

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Java
        if: matrix.android
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.android
        uses: android-actions/setup-android@v4
        with:
          # Not the default 'tools', which the SDK repository no longer has
          packages: platform-tools

      # The runner's latest NDK (r28+) links .so files with 16 KB page alignment,
      # which newer devices need to load them
      - name: Setup Android NDK
        if: matrix.android
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "✗ ANDROID_NDK_LATEST_HOME not set on this runner"
            exit 1
          fi
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "Using NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './tauri -> target'
          key: ${{ matrix.name }}

      - name: Update Tauri version
        shell: bash
        run: |
          VERSION="${{ needs.release-draft.outputs.version }}"
          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' tauri/tauri.conf.json > tmp.json && mv tmp.json tauri/tauri.conf.json
          else
            # Windows fallback using Node.js
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('tauri/tauri.conf.json')); c.version='$VERSION'; fs.writeFileSync('tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n');"
          fi
          echo "Updated tauri.conf.json version to $VERSION"

      # Rises with every run, so each release installs over the last as an update
      - name: Set Android version code
        if: matrix.android
        run: |
          jq --argjson c ${{ github.run_number }} '.bundle.android.versionCode = $c' tauri/tauri.conf.json > tmp.json && mv tmp.json tauri/tauri.conf.json
          echo "Set Android versionCode to ${{ github.run_number }}"

      - name: Build Tauri app
        if: ${{ !matrix.android }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./tauri
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # The Android project is generated fresh each build rather than committed
      - name: Build Android app
        if: matrix.android
        run: |
          # Only the .so Android loads, as an rlib's metadata holds a copy of every embedded page
          sed -i 's/^crate-type = .*/crate-type = ["cdylib"]/' tauri/Cargo.toml

          pnpm tauri android init --ci

          # App icons, otherwise the generated project ships Tauri's default
          cp -R tauri/icons/android/. tauri/gen/android/app/src/main/res/

          # The app's own MainActivity, under the package line Tauri generated
          ACTIVITY=$(find tauri/gen/android/app/src/main -name MainActivity.kt)
          { grep -m1 '^package ' "$ACTIVITY"; grep -v '^package ' tauri/android/MainActivity.kt; } > MainActivity.kt.tmp
          mv MainActivity.kt.tmp "$ACTIVITY"

          # Cargo reruns a build script whose generated files are newer than its last run,
          # so a stub debug pass writes Tauri's first, else Gradle recompiles the whole site
          mkdir -p "$RUNNER_TEMP/stub-site"
          echo '<!doctype html>' > "$RUNNER_TEMP/stub-site/index.html"
          pnpm tauri android build --debug --apk true --aab false --target ${{ matrix.android_target }} \
            --config "{\"build\":{\"frontendDist\":\"$RUNNER_TEMP/stub-site\"}}"
          rm -rf tauri/target/${{ matrix.rust_target }}/debug
          # Its idle Gradle and Kotlin daemons would hold RAM through the long compile
          tauri/gen/android/gradlew --stop
          pkill -f KotlinCompileDaemon || true

          pnpm tauri android build --apk true --aab false --split-per-abi --target ${{ matrix.android_target }}

      - name: Sign Android APK
        if: matrix.android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "✗ Android signing secrets not configured - see DEPLOYMENT.md"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "Signing $UNSIGNED with build-tools $(basename "$BUILD_TOOLS")"

          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out tauri/gen/android/signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$KEYSTORE"

          # Refuse to publish an APK signed by anything but the published certificate
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs tauri/gen/android/signed.apk \
            | grep -m1 'Signer #1 certificate SHA-256 digest:' | awk '{print $NF}')
          EXPECTED=$(echo "$ANDROID_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "✗ APK signing certificate ($ACTUAL) doesn't match ANDROID_CERT_SHA256"
            exit 1
          fi
          echo "✓ Signing certificate matches ANDROID_CERT_SHA256"

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ needs.release-draft.outputs.version }}"
          mkdir -p artifacts

          # macOS
          shopt -s nullglob
          for f in tauri/target/*/release/bundle/dmg/*.dmg; do
            if [[ "$f" == *"aarch64"* ]]; then ARCH="aarch64"; else ARCH="x64"; fi
            cp "$f" "artifacts/scx_app-${VERSION}-macos_${ARCH}.dmg"
          done

          # Windows
          for f in tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "artifacts/scx_app-${VERSION}-windows_x64.exe"
          done

          # Linux
          for f in tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "artifacts/scx_app-${VERSION}-linux_amd64.AppImage"
          done

          # Android
          if [ -f tauri/gen/android/signed.apk ]; then
            cp tauri/gen/android/signed.apk "artifacts/scx_app-${VERSION}-android_${{ matrix.abi }}.apk"
          fi
          shopt -u nullglob

          echo "Artifacts:"
          ls -la artifacts/ || echo "No artifacts found"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-draft.outputs.tag }}
          files: artifacts/*
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-zim:
    name: Build Kiwix ZIM
    needs: release-draft
    runs-on: ubuntu-latest
    outputs:
      zim_name: ${{ steps.zim.outputs.zim_name }}
      zim_size: ${{ steps.zim.outputs.zim_size }}
    steps:
      # The site, the ZIM and libzim's index while it writes get close to the runner's free space
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build

      - name: Unpack site
        shell: bash
        run: tar -xf site.tar && rm site.tar

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Build ZIM
        id: zim
        run: |
          ZIM_NAME="scx_archive-${{ needs.release-draft.outputs.version }}.zim"
          pnpm build:zim "${{ needs.release-draft.outputs.version }}" ".dist/$ZIM_NAME"
          echo "zim_name=$ZIM_NAME" >> $GITHUB_OUTPUT
          echo "zim_size=$(du -h ".dist/$ZIM_NAME" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-draft.outputs.tag }}
          files: .dist/${{ steps.zim.outputs.zim_name }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  sign-release:
    name: Sign Release Artifacts
    needs: [release-draft, build-tauri, build-zim]
    if: always() && needs.release-draft.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Download release artifacts
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ needs.release-draft.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "scx_*" \
            --dir artifacts || true

          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "⚠️ No release artifacts found - all builds may have failed"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_artifacts=true" >> $GITHUB_OUTPUT
          echo "Downloaded artifacts:"
          ls -la artifacts/

      - name: Generate SHA256 checksums
        if: steps.download.outputs.has_artifacts == 'true'
        run: |
          cd artifacts
          sha256sum scx_* > SHA256SUMS.txt
          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Sign checksums with PGP
        if: steps.download.outputs.has_artifacts == 'true'
        id: sign
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          if [ -n "$PGP_PRIVATE_KEY" ]; then
            echo "$PGP_PRIVATE_KEY" | gpg --batch --import
            cd artifacts
            echo "$PGP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign SHA256SUMS.txt
            echo "Created signature: SHA256SUMS.txt.asc"
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "PGP_PRIVATE_KEY not configured, skipping signing"
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checksums and signature
        if: steps.download.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-draft.outputs.tag }}
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.asc
          draft: true
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  finalize-release:
    name: Finalize Release
    needs: [release-draft, build-tauri, build-zim, sign-release]
    if: always() && needs.release-draft.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      auto_deploy: ${{ steps.body.outputs.auto_deploy }}
    steps:
      - name: Check which platforms succeeded
        id: platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get list of uploaded artifacts
          ARTIFACTS=$(gh release view "${{ needs.release-draft.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')

          echo "Available artifacts:"
          echo "$ARTIFACTS"

          # Detect platforms
          PLATFORMS=""
          [[ "$ARTIFACTS" =~ macos_aarch64 ]] && PLATFORMS="${PLATFORMS}- macOS (Apple Silicon)\n"
          [[ "$ARTIFACTS" =~ macos_x64 ]] && PLATFORMS="${PLATFORMS}- macOS (Intel)\n"
          [[ "$ARTIFACTS" =~ linux ]] && PLATFORMS="${PLATFORMS}- Linux\n"
          [[ "$ARTIFACTS" =~ windows ]] && PLATFORMS="${PLATFORMS}- Windows\n"
          [[ "$ARTIFACTS" =~ android_arm64 ]] && PLATFORMS="${PLATFORMS}- Android (64-bit)\n"
          [[ "$ARTIFACTS" =~ android_armv7 ]] && PLATFORMS="${PLATFORMS}- Android (32-bit)\n"
          [[ "$ARTIFACTS" =~ \.zim ]] && echo "zim_available=true" >> $GITHUB_OUTPUT

          if [ -z "$PLATFORMS" ]; then
            echo "platforms_available=false" >> $GITHUB_OUTPUT
            echo "platforms_list=No platform builds succeeded" >> $GITHUB_OUTPUT
          else
            echo "platforms_available=true" >> $GITHUB_OUTPUT
            echo "platforms_list<<EOF" >> $GITHUB_OUTPUT
            echo -e "$PLATFORMS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Update release body
        id: body
        uses: actions/github-script@v9
        with:
          script: |
            const signed = '${{ needs.sign-release.outputs.signed }}' === 'true';
            const pgpPublicKey = '${{ needs.release-draft.outputs.pgp_public_key }}';
            const checksPassed = '${{ needs.release-draft.outputs.checks_passed }}' === 'true';
            const buildsPassed = '${{ needs.build-tauri.result }}' === 'success' && '${{ needs.build-zim.result }}' === 'success';
            const autoDeploy = checksPassed && buildsPassed && '${{ vars.AUTO_DEPLOY }}' !== 'false';
            core.setOutput('auto_deploy', autoDeploy);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const checksLine = checksPassed
              ? `**Build checks:** ✅ [Passed](${runUrl})`
              : `**Build checks:** ❌ [Failed](${runUrl}) - see the "Check build" step, and review the preview before publishing`;
            const fetchFailures = '${{ needs.release-draft.outputs.fetch_failures }}';
            const fetchFailuresLine = fetchFailures && fetchFailures !== 'n/a' ? `\n  - ${fetchFailures}` : '';
            const tagMessage = `${{ needs.release-draft.outputs.tag_message }}`;
            const platformsAvailable = '${{ steps.platforms.outputs.platforms_available }}' === 'true';
            const platformsList = `${{ steps.platforms.outputs.platforms_list }}`;
            const zimAvailable = '${{ steps.platforms.outputs.zim_available }}' === 'true';
            const zimSection = zimAvailable ? `

            <details>
            <summary><strong>About the ZIM Archive</strong></summary>

            The attached \`scx_archive*.zim\` file is the whole site in one file for [Kiwix](https://kiwix.org), a free offline reader for Android, iOS, macOS, Windows and Linux.

            To use it:

            1. [Install Kiwix](https://get.kiwix.org/en/solutions/applications/download-options/)
            2. Download the \`scx_archive*.zim\` file
            3. Open it in Kiwix

            To read it in any browser on your network instead, serve it with \`kiwix-serve\`.

            Kiwix readers differ in what they can run, so anything a reader doesn't support, such as text-to-speech or site search, is left out in that reader. Kiwix has its own full-text search, and Kiwix for Android its own "Read aloud". In readers that support all features, or a browser through \`kiwix-serve\`, every feature works as it does on the website.
            </details>` : '';

            // Build GPG section if signed
            const gpgSection = signed && pgpPublicKey ? `

            Import my public key
            \`\`\`bash
            gpg --keyserver keys.openpgp.org --recv-keys ${pgpPublicKey}
            \`\`\`

            Verify signature
            \`\`\`bash
            gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
            \`\`\`` : '';

            // Build platform warning section if needed
            let platformSection = '';
            if (!platformsAvailable) {
              platformSection = `**⚠️ App Build Failure**

            All platform builds failed for this release. Please check the [Actions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) for details.

            ---

            `;
            } else if (!platformsList.includes('Windows') || !platformsList.includes('Linux') || !platformsList.includes('macOS') || !platformsList.includes('Android (64-bit)') || !platformsList.includes('Android (32-bit)')) {
              platformSection = `**⚠️ App Partial Build**

            Some platform builds failed. Available platforms:

            ${platformsList}

            Missing platforms may be added later if the build issue is resolved.

            ---

            `;
            }

            // Build complete body with installation instructions
            const body = `${tagMessage}

            ---

            <details>
            <summary><strong>About the Archive</strong></summary>

            The attached \`scx_archive*.tar.gz\` file is a fully-featured, offline-first, compressed archive of the whole site.

            To just read the site, the apps (or the ZIM file) are easier. This archive suits self-hosting, or anyone comfortable with a terminal.

            To use it locally:

            1. Download the \`scx_archive*.tar.gz\` file to your device
            2. Extract its contents (open it with your OS's built-in archive utility or a free unzip tool from the App Store / Play Store). You'll get a \`scx_{version}\` folder, with a \`README.txt\` beside it. Windows 10's File Explorer can't open \`.tar.gz\` files, but the free 7-Zip can
            3. Serve the \`scx_{version}\` folder over a local HTTP server, then visit the server's local URL in your browser

            Note: opening \`index.html\` directly (double-clicking it) will **not** work — the site uses absolute references to its other files which only resolve correctly when served over HTTP, not when loaded via the \`file://\` protocol.

            A local HTTP server can be set up for free on any computer, tablet, or smartphone. For example:
            - **Desktop:** run \`python3 -m http.server --bind 127.0.0.1 --directory scx_{version}\` where you extracted it (on Windows, \`py\` in place of \`python3\`), then visit the provided URL in your browser
            - **Mobile or tablet:** free HTTP server apps are available on the App Store / Play Store
            </details>${zimSection}

            <details>
            <summary><strong>App Installation Instructions</strong></summary>

            The attached \`scx_app*\` builds are native wrappers around the offline archive. The desktop apps are not code-signed to avoid $200-500 USD/year in certificate costs. The Android apps are signed with this project's own key, so new versions install over old ones as updates. The apps are safe and built from public source code, but your OS will require manual approval on first install or launch.

            **macOS:**

            - Download and open the \`.dmg\` file appropriate for your machine
            - You'll see _"cannot be opened because it is from an unidentified developer"_
            - Go to **System Settings → Privacy & Security**
            - Click **"Open Anyway"** next to the blocked app message
            - Click **"Open"** in the confirmation dialog

            **Windows:**

            - Download and extract the \`.exe\` file
            - You'll see _"Windows protected your PC"_
            - Click **"More info"**
            - Click **"Run anyway"**

            **Linux:** No security warnings - just download and run.

            **Android** (7.0 or newer):

            - Download the \`android_arm64\` APK, which suits almost every phone and tablet made since around 2017. If it says _"App not installed"_, use the \`android_armv7\` APK instead, which is for older 32-bit devices
            - Open the downloaded file, and when asked, allow your browser or file manager to _"Install unknown apps"_
            - If Play Protect warns about an unknown developer, tap **"More details"** then **"Install anyway"**
            - You'll need about 1 GB of free space while it installs
            - Later versions install over the top as updates, keeping your place
            </details>

            <details>
            <summary><strong>Verification Instructions (optional)</strong></summary>

            Verify checksum matches
            \`\`\`bash
            sha256sum -c --ignore-missing SHA256SUMS.txt
            \`\`\`${gpgSection}

            **Android:** every APK is signed with the same certificate, so you can check one is genuine, including an APK someone shared with you directly. Its signing certificate should match:

            \`\`\`
            express.suttacentral
            ${{ env.ANDROID_CERT_SHA256 }}
            \`\`\`

            - On your phone: use an app verifier app (one that checks an APK's signing certificate), point it at the APK or the installed app, and compare against the text above
            - On a computer: \`apksigner verify --print-certs scx_app-*.apk\` shows the same fingerprint in lowercase without colons
            </details>

            ---

            <details><summary>Build Info</summary>

            - Date: ${{ needs.release-draft.outputs.date }}
            - Trigger: Tag push to main
            - Version: ${{ needs.release-draft.outputs.version }}
            - Files: ${{ needs.release-draft.outputs.html_count }} HTML files (${{ needs.release-draft.outputs.total_count }} total)
            - Archive size: ${{ needs.release-draft.outputs.archive_size || 'n/a' }}
            - ZIM size: ${{ needs.build-zim.outputs.zim_size || 'n/a' }}
            - Build time: ${{ needs.release-draft.outputs.build_duration || 'n/a' }} (11ty: ${{ needs.release-draft.outputs.eleventy_duration || 'n/a' }}, search index: ${{ needs.release-draft.outputs.search_duration || 'n/a' }})
            - API fetch: ${{ needs.release-draft.outputs.fetch_summary || 'n/a' }}${fetchFailuresLine}
            - Pages written: ${{ needs.release-draft.outputs.eleventy_files || 'n/a' }}
            - HTML: ${{ needs.release-draft.outputs.html_summary || 'n/a' }}
            - Assets minified: ${{ needs.release-draft.outputs.assets_summary || 'n/a' }}
            - Search index: ${{ needs.release-draft.outputs.search_pages || 'n/a' }} pages, ${{ needs.release-draft.outputs.search_words || 'n/a' }} words

            </details>${autoDeploy ? '' : `

            ---

            ${platformSection}
            ${checksLine}

            **Preview Deployment:** ${{ needs.release-draft.outputs.preview_url }}

            **Next Steps:**
            1. Review the preview deployment above
            2. If satisfied, edit this release body and click "Publish release" to deploy to production
            3. Publishing will automatically:
               - Deploy the exact same build to Vercel production
               - Upload assets to Codeberg releases`}`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.release-draft.outputs.release_id }},
              tag_name: '${{ needs.release-draft.outputs.tag }}',
              body: body,
              // Published by GITHUB_TOKEN, which doesn't trigger deploy-published-release.yml, so `auto-deploy` deploys it
              ...(autoDeploy && { draft: false })
            });

            console.log('✓ Release body updated');

  auto-deploy:
    name: Auto-deploy Release
    needs: [release-draft, finalize-release]
    if: >
      always() &&
      needs.finalize-release.outputs.auto_deploy == 'true'
    uses: ./.github/workflows/deploy-release.yml
    with:
      release_id: '${{ needs.release-draft.outputs.release_id }}'
    secrets: inherit

  pr-preview:
    name: Pull Request Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Get date
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # A PR's later runs that day reuse its first fetch, or what a failed run fetched
      - name: Restore fetch cache
        id: fetch-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ steps.day.outputs.day }}
          restore-keys: fetch-${{ github.job }}-${{ steps.day.outputs.day }}-

      - name: Build site
        id: build
        run: pnpm predeploy

      - name: Save daily fetch cache
        if: steps.fetch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ steps.day.outputs.day }}

      # Each attempt saves under its own key, as a cache key can't be saved twice
      - name: Save fetch cache
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create archive for preview
        env:
          CI: true
        run: pnpm release:dry nozim

      - name: Deploy to Vercel Preview
        id: vercel_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          OUTPUT=$(npx vercel deploy --archive=tgz --cwd=_site -A "$PWD/vercel.json" --token="$VERCEL_TOKEN" 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*vercel\.app[^ ]*' | head -1)
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Comment PR with preview URL
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Preview Deployment\n\n🚀 Preview is ready: ${{ steps.vercel_preview.outputs.preview_url }}'
            })

      - name: Check build
        run: pnpm test

  content-refresh:
    name: Content Refresh Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
      preview_tag: ${{ steps.preview_tag.outputs.tag }}
      date: ${{ steps.date.outputs.date }}
      preview_url: ${{ steps.vercel_deploy.outputs.preview_url }}
      html_count: ${{ steps.size.outputs.html_count }}
      total_count: ${{ steps.size.outputs.total_count }}
      archive_name: ${{ steps.archive.outputs.archive_name }}
      archive_size: ${{ steps.size.outputs.size }}
      build_duration: ${{ steps.stats.outputs.build_duration }}
      eleventy_duration: ${{ steps.stats.outputs.eleventy_duration }}
      search_duration: ${{ steps.stats.outputs.search_duration }}
      eleventy_files: ${{ steps.stats.outputs.eleventy_files }}
      html_summary: ${{ steps.stats.outputs.html_summary }}
      fetch_summary: ${{ steps.stats.outputs.fetch_summary }}
      fetch_failures: ${{ steps.stats.outputs.fetch_failures }}
      assets_summary: ${{ steps.stats.outputs.assets_summary }}
      search_pages: ${{ steps.stats.outputs.search_pages }}
      search_words: ${{ steps.stats.outputs.search_words }}
      checks_passed: ${{ steps.checks.outcome == 'success' }}
      trigger: ${{ github.event_name == 'schedule' && 'Monthly scheduled build' || 'Manual trigger' }}
      pgp_public_key: ${{ steps.site_meta.outputs.pgp_public_key }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      # A re-run picks up the cache its failed attempt saved, so it only fetches what's missing
      - name: Restore fetch cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fetch-${{ github.job }}-${{ github.run_id }}-

      - name: Build site
        id: build
        shell: bash
        run: |
          START=$(date +%s)
          pnpm predeploy 2>&1 | tee build.log
          echo "seconds=$(( $(date +%s) - START ))" >> $GITHUB_OUTPUT

      # Each attempt saves under its own key, as a cache key can't be saved twice
      - name: Save fetch cache
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache
          key: fetch-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Whether the fetched data built the site it should. A failure doesn't stop the release,
      # it just leaves it for review by hand instead of deploying itself
      - name: Check build
        id: checks
        continue-on-error: true
        run: pnpm test

      - name: Collect build stats
        id: stats
        continue-on-error: true
        env:
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
        run: node tools/buildStats.js

      - name: Get current version
        id: version
        run: |
          # Get the latest tag and extract only the base version (remove any preview suffixes)
          LATEST_TAG=$(git describe --tags --abbrev=0)
          # Extract base version (e.g., "1.3.0" from "v1.3.0-content-refresh-20251218-110205")
          BASE_VERSION=$(echo "$LATEST_TAG" | sed 's/^v//' | sed 's/-content-refresh-.*$//')
          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base version: $BASE_VERSION"

      - name: Generate datestamp
        id: date
        run: |
          DATE=$(date +%Y%m%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "Datestamp: $DATE"

      - name: Generate timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Timestamp: $TIMESTAMP"

      - name: Create preview tag
        id: preview_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}-content-refresh-${{ steps.timestamp.outputs.timestamp }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Preview tag: $TAG"

      - name: Push preview tag to all remotes
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create the tag
          git tag ${{ steps.preview_tag.outputs.tag }}

          # Push to GitHub (origin)
          git push origin ${{ steps.preview_tag.outputs.tag }}

          # Push to Codeberg (if configured)
          if [ -n "$CODEBERG_TOKEN" ] && [ -n "$CODEBERG_REPO" ]; then
            git push https://oauth2:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_REPO} ${{ steps.preview_tag.outputs.tag }} || echo "⊘ Codeberg push failed"
          else
            echo "⊘ Codeberg not configured, skipping tag push"
          fi

      - name: Read release key
        id: site_meta
        run: node -e "import('./src/data/_siteMetaData.js').then(m => console.log('pgp_public_key=' + (m.default().pgpPublicKey ?? '')))" >> $GITHUB_OUTPUT

      - name: Create archive
        id: archive
        env:
          CI: true
        run: |
          ARCHIVE_NAME="scx_archive-${{ steps.version.outputs.version }}-content-refresh-${{ steps.date.outputs.date }}.tar.gz"
          echo "Creating archive: $ARCHIVE_NAME"
          node tools/archive.js "${{ steps.version.outputs.version }}-content-refresh-${{ steps.date.outputs.date }}" ".dist/$ARCHIVE_NAME"
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "archive_path=.dist/$ARCHIVE_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to Vercel Preview
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          OUTPUT=$(npx vercel deploy --archive=tgz --cwd=_site -A "$PWD/vercel.json" --token="$VERCEL_TOKEN" 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*vercel\.app[^ ]*' | head -1)
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
          echo "Preview URL: $URL"

      - name: Get archive size and file count
        id: size
        run: |
          SIZE=$(du -h .dist/${{ steps.archive.outputs.archive_name }} | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "Archive size: $SIZE"

          HTML_COUNT=$(find _site -type f -name "*.html" | wc -l | tr -d ' ')
          TOTAL_COUNT=$(find _site -type f | wc -l | tr -d ' ')
          echo "html_count=$HTML_COUNT" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "HTML files: $HTML_COUNT"
          echo "Total files: $TOTAL_COUNT"

      # One file, as Windows runners fail to download the site's 241k files from an artifact
      - name: Pack site for app builds
        run: tar -cf site.tar _site

      - name: Upload site artifact for Tauri builds
        uses: actions/upload-artifact@v7
        with:
          name: site-build-content-refresh
          path: site.tar
          retention-days: 1

      - name: Create pre-release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.preview_tag.outputs.tag }}
          name: v${{ steps.version.outputs.version }} - Content Refresh (${{ steps.date.outputs.date }})
          draft: false
          prerelease: true
          body: |
            Fresh content fetched from SuttaCentral APIs

            ---

            **Preview Deployment:** ${{ steps.vercel_deploy.outputs.preview_url }}

            > ⏳ **App builds in progress.** Please wait for all builds to complete before publishing.

            **Build Info:**
            - Date: ${{ steps.date.outputs.date }}
            - Trigger: ${{ github.event_name == 'schedule' && 'Monthly scheduled build' || 'Manual trigger' }}
            - Version: ${{ steps.version.outputs.version }}
            - Preview Tag: ${{ steps.preview_tag.outputs.tag }}
            - Files: ${{ steps.size.outputs.html_count }} HTML files (${{ steps.size.outputs.total_count }} total)
          files: .dist/${{ steps.archive.outputs.archive_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  build-tauri-content-refresh:
    name: Build Tauri Content Refresh (${{ matrix.name }})
    needs: content-refresh
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: 'macOS ARM64'
            rust_target: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: 'macOS Intel'
            rust_target: 'x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            name: 'Linux'
            rust_target: ''
          - platform: windows-latest
            args: ''
            name: 'Windows'
            rust_target: ''
          - platform: ubuntu-latest
            name: 'Android ARM64'
            rust_target: 'aarch64-linux-android'
            android: true
            android_target: 'aarch64'
            abi: 'arm64'
          - platform: ubuntu-latest
            name: 'Android ARMv7'
            rust_target: 'armv7-linux-androideabi'
            android: true
            android_target: 'armv7'
            abi: 'armv7'
    runs-on: ${{ matrix.platform }}

    steps:
      # The site, Rust target dir and Gradle together get close to the runner's free space
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      # Compiling the app crate, with the whole site embedded, can run the runner out of memory
      - name: Add swap
        if: runner.os == 'Linux'
        run: |
          sudo fallocate -l 16G /swapfile.ci
          sudo chmod 600 /swapfile.ci
          sudo mkswap /swapfile.ci
          sudo swapon /swapfile.ci
          free -h
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build-content-refresh

      - name: Unpack site
        shell: bash
        run: tar -xf site.tar && rm site.tar

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Java
        if: matrix.android
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.android
        uses: android-actions/setup-android@v4
        with:
          # Not the default 'tools', which the SDK repository no longer has
          packages: platform-tools

      # The runner's latest NDK (r28+) links .so files with 16 KB page alignment,
      # which newer devices need to load them
      - name: Setup Android NDK
        if: matrix.android
        run: |
          if [ -z "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "✗ ANDROID_NDK_LATEST_HOME not set on this runner"
            exit 1
          fi
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "Using NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './tauri -> target'
          key: ${{ matrix.name }}

      - name: Update Tauri version
        shell: bash
        run: |
          VERSION="${{ needs.content-refresh.outputs.version }}-content-refresh-${{ needs.content-refresh.outputs.date }}"
          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' tauri/tauri.conf.json > tmp.json && mv tmp.json tauri/tauri.conf.json
          else
            # Windows fallback using Node.js
            node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('tauri/tauri.conf.json')); c.version='$VERSION'; fs.writeFileSync('tauri/tauri.conf.json', JSON.stringify(c,null,2)+'\n');"
          fi
          echo "Updated tauri.conf.json version to $VERSION"

      # Rises with every run, so each release installs over the last as an update
      - name: Set Android version code
        if: matrix.android
        run: |
          jq --argjson c ${{ github.run_number }} '.bundle.android.versionCode = $c' tauri/tauri.conf.json > tmp.json && mv tmp.json tauri/tauri.conf.json
          echo "Set Android versionCode to ${{ github.run_number }}"

      - name: Build Tauri app
        if: ${{ !matrix.android }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: ./tauri
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # The Android project is generated fresh each build rather than committed
      - name: Build Android app
        if: matrix.android
        run: |
          # Only the .so Android loads, as an rlib's metadata holds a copy of every embedded page
          sed -i 's/^crate-type = .*/crate-type = ["cdylib"]/' tauri/Cargo.toml

          pnpm tauri android init --ci

          # App icons, otherwise the generated project ships Tauri's default
          cp -R tauri/icons/android/. tauri/gen/android/app/src/main/res/

          # The app's own MainActivity, under the package line Tauri generated
          ACTIVITY=$(find tauri/gen/android/app/src/main -name MainActivity.kt)
          { grep -m1 '^package ' "$ACTIVITY"; grep -v '^package ' tauri/android/MainActivity.kt; } > MainActivity.kt.tmp
          mv MainActivity.kt.tmp "$ACTIVITY"

          # Cargo reruns a build script whose generated files are newer than its last run,
          # so a stub debug pass writes Tauri's first, else Gradle recompiles the whole site
          mkdir -p "$RUNNER_TEMP/stub-site"
          echo '<!doctype html>' > "$RUNNER_TEMP/stub-site/index.html"
          pnpm tauri android build --debug --apk true --aab false --target ${{ matrix.android_target }} \
            --config "{\"build\":{\"frontendDist\":\"$RUNNER_TEMP/stub-site\"}}"
          rm -rf tauri/target/${{ matrix.rust_target }}/debug
          # Its idle Gradle and Kotlin daemons would hold RAM through the long compile
          tauri/gen/android/gradlew --stop
          pkill -f KotlinCompileDaemon || true

          pnpm tauri android build --apk true --aab false --split-per-abi --target ${{ matrix.android_target }}

      - name: Sign Android APK
        if: matrix.android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "✗ Android signing secrets not configured - see DEPLOYMENT.md"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "Signing $UNSIGNED with build-tools $(basename "$BUILD_TOOLS")"

          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out tauri/gen/android/signed.apk \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$KEYSTORE"

          # Refuse to publish an APK signed by anything but the published certificate
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs tauri/gen/android/signed.apk \
            | grep -m1 'Signer #1 certificate SHA-256 digest:' | awk '{print $NF}')
          EXPECTED=$(echo "$ANDROID_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "✗ APK signing certificate ($ACTUAL) doesn't match ANDROID_CERT_SHA256"
            exit 1
          fi
          echo "✓ Signing certificate matches ANDROID_CERT_SHA256"

      - name: Rename artifacts
        shell: bash
        run: |
          VERSION="${{ needs.content-refresh.outputs.version }}-content-refresh-${{ needs.content-refresh.outputs.date }}"
          mkdir -p artifacts

          # macOS
          shopt -s nullglob
          for f in tauri/target/*/release/bundle/dmg/*.dmg; do
            if [[ "$f" == *"aarch64"* ]]; then ARCH="aarch64"; else ARCH="x64"; fi
            cp "$f" "artifacts/scx_app-${VERSION}-macos_${ARCH}.dmg"
          done

          # Windows
          for f in tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "artifacts/scx_app-${VERSION}-windows_x64.exe"
          done

          # Linux
          for f in tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "artifacts/scx_app-${VERSION}-linux_amd64.AppImage"
          done

          # Android
          if [ -f tauri/gen/android/signed.apk ]; then
            cp tauri/gen/android/signed.apk "artifacts/scx_app-${VERSION}-android_${{ matrix.abi }}.apk"
          fi
          shopt -u nullglob

          echo "Artifacts:"
          ls -la artifacts/ || echo "No artifacts found"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.content-refresh.outputs.preview_tag }}
          files: artifacts/*
          token: ${{ secrets.GITHUB_TOKEN }}

  build-zim-content-refresh:
    name: Build Kiwix ZIM Content Refresh
    needs: content-refresh
    runs-on: ubuntu-latest
    outputs:
      zim_name: ${{ steps.zim.outputs.zim_name }}
      zim_size: ${{ steps.zim.outputs.zim_size }}
    steps:
      # The site, the ZIM and libzim's index while it writes get close to the runner's free space
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build-content-refresh

      - name: Unpack site
        shell: bash
        run: tar -xf site.tar && rm site.tar

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.3.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Build ZIM
        id: zim
        run: |
          ZIM_NAME="scx_archive-${{ needs.content-refresh.outputs.version }}-content-refresh-${{ needs.content-refresh.outputs.date }}.zim"
          pnpm build:zim "${{ needs.content-refresh.outputs.version }}-content-refresh-${{ needs.content-refresh.outputs.date }}" ".dist/$ZIM_NAME"
          echo "zim_name=$ZIM_NAME" >> $GITHUB_OUTPUT
          echo "zim_size=$(du -h ".dist/$ZIM_NAME" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.content-refresh.outputs.preview_tag }}
          files: .dist/${{ steps.zim.outputs.zim_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

  sign-release-content-refresh:
    name: Sign Content Refresh Artifacts
    needs:
      [content-refresh, build-tauri-content-refresh, build-zim-content-refresh]
    if: always() && needs.content-refresh.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Download release artifacts
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ needs.content-refresh.outputs.preview_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "scx_*" \
            --dir artifacts || true

          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "⚠️ No release artifacts found - all builds may have failed"
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_artifacts=true" >> $GITHUB_OUTPUT
          echo "Downloaded artifacts:"
          ls -la artifacts/

      - name: Generate SHA256 checksums
        if: steps.download.outputs.has_artifacts == 'true'
        run: |
          cd artifacts
          sha256sum scx_* > SHA256SUMS.txt
          echo "Generated checksums:"
          cat SHA256SUMS.txt

      - name: Sign checksums with PGP
        if: steps.download.outputs.has_artifacts == 'true'
        id: sign
        env:
          PGP_PRIVATE_KEY: ${{ secrets.PGP_PRIVATE_KEY }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          if [ -n "$PGP_PRIVATE_KEY" ]; then
            echo "$PGP_PRIVATE_KEY" | gpg --batch --import
            cd artifacts
            echo "$PGP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign SHA256SUMS.txt
            echo "Created signature: SHA256SUMS.txt.asc"
            echo "signed=true" >> $GITHUB_OUTPUT
          else
            echo "PGP_PRIVATE_KEY not configured, skipping signing"
            echo "signed=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload checksums and signature
        if: steps.download.outputs.has_artifacts == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.content-refresh.outputs.preview_tag }}
          files: |
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.asc
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}

  finalize-release-content-refresh:
    name: Finalize Content Refresh Release
    needs:
      [
        content-refresh,
        build-tauri-content-refresh,
        build-zim-content-refresh,
        sign-release-content-refresh,
      ]
    if: always() && needs.content-refresh.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      auto_deploy: ${{ steps.body.outputs.auto_deploy }}
    steps:
      - name: Check which platforms succeeded
        id: platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get list of uploaded artifacts
          ARTIFACTS=$(gh release view "${{ needs.content-refresh.outputs.preview_tag }}" \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')

          echo "Available artifacts:"
          echo "$ARTIFACTS"

          # Detect platforms
          PLATFORMS=""
          [[ "$ARTIFACTS" =~ macos_aarch64 ]] && PLATFORMS="${PLATFORMS}- macOS (Apple Silicon)\n"
          [[ "$ARTIFACTS" =~ macos_x64 ]] && PLATFORMS="${PLATFORMS}- macOS (Intel)\n"
          [[ "$ARTIFACTS" =~ linux ]] && PLATFORMS="${PLATFORMS}- Linux\n"
          [[ "$ARTIFACTS" =~ windows ]] && PLATFORMS="${PLATFORMS}- Windows\n"
          [[ "$ARTIFACTS" =~ android_arm64 ]] && PLATFORMS="${PLATFORMS}- Android (64-bit)\n"
          [[ "$ARTIFACTS" =~ android_armv7 ]] && PLATFORMS="${PLATFORMS}- Android (32-bit)\n"
          [[ "$ARTIFACTS" =~ \.zim ]] && echo "zim_available=true" >> $GITHUB_OUTPUT

          if [ -z "$PLATFORMS" ]; then
            echo "platforms_available=false" >> $GITHUB_OUTPUT
            echo "platforms_list=No platform builds succeeded" >> $GITHUB_OUTPUT
          else
            echo "platforms_available=true" >> $GITHUB_OUTPUT
            echo "platforms_list<<EOF" >> $GITHUB_OUTPUT
            echo -e "$PLATFORMS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Update release body
        id: body
        uses: actions/github-script@v9
        with:
          script: |
            const signed = '${{ needs.sign-release-content-refresh.outputs.signed }}' === 'true';
            const pgpPublicKey = '${{ needs.content-refresh.outputs.pgp_public_key }}';
            const checksPassed = '${{ needs.content-refresh.outputs.checks_passed }}' === 'true';
            const buildsPassed = '${{ needs.build-tauri-content-refresh.result }}' === 'success' && '${{ needs.build-zim-content-refresh.result }}' === 'success';
            const autoDeploy = checksPassed && buildsPassed && '${{ vars.AUTO_DEPLOY }}' !== 'false';
            core.setOutput('auto_deploy', autoDeploy);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const checksLine = checksPassed
              ? `**Build checks:** ✅ [Passed](${runUrl})`
              : `**Build checks:** ❌ [Failed](${runUrl}) - see the "Check build" step, and review the preview before publishing`;
            const fetchFailures = '${{ needs.content-refresh.outputs.fetch_failures }}';
            const fetchFailuresLine = fetchFailures && fetchFailures !== 'n/a' ? `\n  - ${fetchFailures}` : '';
            const platformsAvailable = '${{ steps.platforms.outputs.platforms_available }}' === 'true';
            const platformsList = `${{ steps.platforms.outputs.platforms_list }}`;
            const zimAvailable = '${{ steps.platforms.outputs.zim_available }}' === 'true';
            const zimSection = zimAvailable ? `

            <details>
            <summary><strong>About the ZIM Archive</strong></summary>

            The attached \`scx_archive*.zim\` file is the whole site in one file for [Kiwix](https://kiwix.org), a free offline reader for Android, iOS, macOS, Windows and Linux.

            To use it:

            1. [Install Kiwix](https://get.kiwix.org/en/solutions/applications/download-options/)
            2. Download the \`scx_archive*.zim\` file
            3. Open it in Kiwix

            To read it in any browser on your network instead, serve it with \`kiwix-serve\`.

            Kiwix readers differ in what they can run, so anything a reader doesn't support, such as text-to-speech or site search, is left out in that reader. Kiwix has its own full-text search, and Kiwix for Android its own "Read aloud". In readers that support all features, or a browser through \`kiwix-serve\`, every feature works as it does on the website.
            </details>` : '';

            // Build GPG section if signed
            const gpgSection = signed && pgpPublicKey ? `

            Import my public key
            \`\`\`bash
            gpg --keyserver keys.openpgp.org --recv-keys ${pgpPublicKey}
            \`\`\`

            Verify signature
            \`\`\`bash
            gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
            \`\`\`` : '';

            // Build platform warning section if needed
            let platformSection = '';
            if (!platformsAvailable) {
              platformSection = `** ⚠️ App Build Failure**

            All platform builds failed for this release. Please check the [Actions tab](https://github.com/${context.repo.owner}/${context.repo.repo}/actions) for details.

            ---

            `;
            } else if (!platformsList.includes('Windows') || !platformsList.includes('Linux') || !platformsList.includes('macOS') || !platformsList.includes('Android (64-bit)') || !platformsList.includes('Android (32-bit)')) {
              platformSection = `**⚠️ App Partial Build**

            Some platform builds failed. Available platforms:

            ${platformsList}

            Missing platforms may be added later if the build issue is resolved.

            ---

            `;
            }

            // Build complete body with installation instructions
            const body = `Fresh content fetched from SuttaCentral APIs

            ---

            <details>
            <summary><strong>About the Archive</strong></summary>

            The attached \`scx_archive*.tar.gz\` file is a fully-featured, offline-first, compressed archive of the whole site.

            To just read the site, the apps (or the ZIM file) are easier. This archive suits self-hosting, or anyone comfortable with a terminal.

            To use it locally:

            1. Download the \`scx_archive*.tar.gz\` file to your device
            2. Extract its contents (open it with your OS's built-in archive utility or a free unzip tool from the App Store / Play Store). You'll get a \`scx_{version}\` folder, with a \`README.txt\` beside it. Windows 10's File Explorer can't open \`.tar.gz\` files, but the free 7-Zip can
            3. Serve the \`scx_{version}\` folder over a local HTTP server, then visit the server's local URL in your browser

            Note: opening \`index.html\` directly (double-clicking it) will **not** work — the site uses absolute references to its other files which only resolve correctly when served over HTTP, not when loaded via the \`file://\` protocol.

            A local HTTP server can be set up for free on any computer, tablet, or smartphone. For example:
            - **Desktop:** run \`python3 -m http.server --bind 127.0.0.1 --directory scx_{version}\` where you extracted it (on Windows, \`py\` in place of \`python3\`), then visit the provided URL in your browser
            - **Mobile or tablet:** free HTTP server apps are available on the App Store / Play Store
            </details>${zimSection}

            <details>
            <summary><strong>App Installation Instructions</strong></summary>

            The attached \`scx_app*\` builds are native wrappers around the offline archive. The desktop apps are not code-signed to avoid $200-500 USD/year in certificate costs. The Android apps are signed with this project's own key, so new versions install over old ones as updates. The apps are safe and built from public source code, but your OS will require manual approval on first install or launch.

            **macOS:**

            - Download and open the \`.dmg\` file appropriate for your machine
            - You'll see _"cannot be opened because it is from an unidentified developer"_
            - Go to **System Settings → Privacy & Security**
            - Click **"Open Anyway"** next to the blocked app message
            - Click **"Open"** in the confirmation dialog

            **Windows:**

            - Download and extract the \`.exe\` file
            - You'll see _"Windows protected your PC"_
            - Click **"More info"**
            - Click **"Run anyway"**

            **Linux:** No security warnings - just download and run.

            **Android** (7.0 or newer):

            - Download the \`android_arm64\` APK, which suits almost every phone and tablet made since around 2017. If it says _"App not installed"_, use the \`android_armv7\` APK instead, which is for older 32-bit devices
            - Open the downloaded file, and when asked, allow your browser or file manager to _"Install unknown apps"_
            - If Play Protect warns about an unknown developer, tap **"More details"** then **"Install anyway"**
            - You'll need about 1 GB of free space while it installs
            - Later versions install over the top as updates, keeping your place
            </details>

            <details>
            <summary><strong>Verification Instructions (optional)</strong></summary>

            Verify checksum matches
            \`\`\`bash
            sha256sum -c --ignore-missing SHA256SUMS.txt
            \`\`\`${gpgSection}

            **Android:** every APK is signed with the same certificate, so you can check one is genuine, including an APK someone shared with you directly. Its signing certificate should match:

            \`\`\`
            express.suttacentral
            ${{ env.ANDROID_CERT_SHA256 }}
            \`\`\`

            - On your phone: use an app verifier app (one that checks an APK's signing certificate), point it at the APK or the installed app, and compare against the text above
            - On a computer: \`apksigner verify --print-certs scx_app-*.apk\` shows the same fingerprint in lowercase without colons
            </details>

            ---

            <details><summary>Build Info</summary>

            - Date: ${{ needs.content-refresh.outputs.date }}
            - Trigger: ${{ needs.content-refresh.outputs.trigger }}
            - Version: ${{ needs.content-refresh.outputs.version }}
            - Preview Tag: ${{ needs.content-refresh.outputs.preview_tag }}
            - Files: ${{ needs.content-refresh.outputs.html_count }} HTML files (${{ needs.content-refresh.outputs.total_count }} total)
            - Archive size: ${{ needs.content-refresh.outputs.archive_size || 'n/a' }}
            - ZIM size: ${{ needs.build-zim-content-refresh.outputs.zim_size || 'n/a' }}
            - Build time: ${{ needs.content-refresh.outputs.build_duration || 'n/a' }} (11ty: ${{ needs.content-refresh.outputs.eleventy_duration || 'n/a' }}, search index: ${{ needs.content-refresh.outputs.search_duration || 'n/a' }})
            - API fetch: ${{ needs.content-refresh.outputs.fetch_summary || 'n/a' }}${fetchFailuresLine}
            - Pages written: ${{ needs.content-refresh.outputs.eleventy_files || 'n/a' }}
            - HTML: ${{ needs.content-refresh.outputs.html_summary || 'n/a' }}
            - Assets minified: ${{ needs.content-refresh.outputs.assets_summary || 'n/a' }}
            - Search index: ${{ needs.content-refresh.outputs.search_pages || 'n/a' }} pages, ${{ needs.content-refresh.outputs.search_words || 'n/a' }} words

            </details>${autoDeploy ? '' : `

            ---

            ${platformSection}
            ${checksLine}

            **Preview Deployment:** ${{ needs.content-refresh.outputs.preview_url }}

            **Next Steps:**
            1. Review the preview deployment above
            2. If satisfied, edit this release body and uncheck "Set as a pre-release" to promote to production
            3. Publishing will automatically:
               - Deploy the exact same build to Vercel production
               - Upload assets to Codeberg releases
               - Clean up the preview tag from all remotes
            4. Deleting will automatically:
               - Clean up the preview tag from all remotes`}`;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.content-refresh.outputs.release_id }},
              tag_name: '${{ needs.content-refresh.outputs.preview_tag }}',
              body: body,
              // Published by GITHUB_TOKEN, which doesn't trigger deploy-published-release.yml, so `auto-deploy-content-refresh` deploys it
              ...(autoDeploy && { prerelease: false })
            });

            console.log('✓ Release body updated');

  auto-deploy-content-refresh:
    name: Auto-deploy Content Refresh
    needs: [content-refresh, finalize-release-content-refresh]
    if: >
      always() &&
      needs.finalize-release-content-refresh.outputs.auto_deploy == 'true'
    uses: ./.github/workflows/deploy-release.yml
    with:
      release_id: '${{ needs.content-refresh.outputs.release_id }}'
    secrets: inherit
